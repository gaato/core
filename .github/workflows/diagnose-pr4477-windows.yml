name: Diagnose PR 4477 Windows timeout

on:
  push:
    branches: [diagnose/pr-4477-windows-timeout]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        revision:
          - label: base
            sha: b80c2f1436558397b1210092e8b4c5527f4aecd4
          - label: pr-merge
            sha: 02a656e79f2f08d5343f0c859e0e10ef5bf79c75
        mode: [debug, release]
    env:
      MOON_COVE_REPORT_ENABLED: "1"
      MOON_WASM_NEW_ALLOCATOR: "1"
      DIAG_SOURCE: ${{ github.workspace }}/source
      DIAG_MODE: ${{ matrix.mode }}
    steps:
      - name: Preserve LF bytes as in the original CI
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out diagnostic tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics
          persist-credentials: false

      - name: Check out the exact original test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moonbitlang/core
          ref: ${{ matrix.revision.sha }}
          path: source
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install the original MoonBit toolchain
        uses: ./source/.github/actions/setup
        with:
          version: 0.10.17+d971670cd

      - name: Record compiler and runner versions
        shell: pwsh
        run: |
          moon version --all
          cl /?

      - name: Diagnose each HTTP test
        timeout-minutes: 30
        env:
          DIAG_PHASE: http
          DIAG_LOG_DIR: ${{ runner.temp }}/pr4477-logs/http
        shell: bash
        run: moon run --target native diagnostics/scripts/diagnose_pr4477_windows.mbtx

      - name: Diagnose the full native suite
        if: always()
        timeout-minutes: 40
        env:
          DIAG_PHASE: whole
          DIAG_LOG_DIR: ${{ runner.temp }}/pr4477-logs/whole
        shell: bash
        run: moon run --target native diagnostics/scripts/diagnose_pr4477_windows.mbtx

      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr4477-${{ matrix.revision.label }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/pr4477-logs
          retention-days: 7
          if-no-files-found: warn
